{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
        <!-- 左侧 Logo -->
        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
            <i class="fa-solid fa-plug"></i>
            <span class="ms-2 fw-bold"> PowerUp </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end">
            <ul class="navbar-nav align-items-center">
                {% if request.user.is_authenticated %}
                    <!-- Welcome -->
                    <li class="nav-item me-3">
                        <span class="nav-link  text-white fw-bold"> Welcome, {{ request.user.username }} !</span>
                    </li>
                    <!-- Wallet -->
                    {% if not request.user.is_staff %}
                        <li class="nav-item me-3">
                            <a class="nav-link text-white fw-bold" href="{% url 'view_wallet' %}">
                                <i class="fas fa-wallet icon-spacing"></i> Wallet
                            </a>
                        </li>
                    {% endif %}
                    <!-- Logout -->
                    <li class="nav-item">
                        <form id="logout-form" method="post" action="{% url 'logout' %}" style="display: none;">
                            {% csrf_token %}
                        </form>
                        <a class="nav-link text-white fw-bold" href="#" onclick="document.getElementById('logout-form').submit(); return false;">
                            <i class="fas fa-sign-out-alt icon-spacing"></i> Logout
                        </a>
                    </li>
                {% else %}
                    <!-- 未登录用户 -->
                    <li class="nav-item me-3">
                        <a class="nav-link text-white fw-bold" href="{% url 'login' %}">
                            <i class="fa-solid fa-circle-user"></i> User
                        </a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link text-white fw-bold" href="{% url 'manager_login' %}">
                            <i class="fas fa-user-shield"></i> Manager
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white fw-bold" href="{% url 'register' %}">
                            <i class="fa-solid fa-pen-to-square"></i> Register
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<script src="{% static 'js/logout.js' %}"></script>
