{% extends 'includes/base.html' %}
{% load static %}
{% block title %}Submit Feedback{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/feedback.css' %}">
{% endblock %}
{% block content %}

<h2 class="page-title">
    <i class="fas fa-comment-dots icon-spacing"></i> Feedback
</h2>

    <form method="POST" class="feedback-card" id="feedbackForm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="user_display" class="form-label"><strong>User</strong></label>
            <input type="text" class="feedback-input" id="user_display" value="{{ request.user.username }}" disabled>
            <input type="hidden" name="user_id" value="{{ request.user.id }}">
        </div>

        <div class="mb-3">
            <label for="feedback_type" class="form-label"><strong>Feedback Type</strong></label>

            <select class="feedback-select" name="feedback_type" id="feedback_type" required>
                <option value="">-- Select --</option>
                <option value="normal">Normal</option>
                <option value="abnormal">Abnormal</option>
            </select>
            <!-- 退款提示信息 -->
            <p id="default-warning" class="default-warning">
                ⚠️ Only select "Abnormal" if the device is unusable.<br>
            </p>

        </div>

        <div class="mb-3">
            <label for="message" class="form-label"><strong>Message</strong></label>
            <textarea class="feedback-textarea" name="message" id="message" rows="4" required></textarea>
        </div>

        <a href="{% url 'report_feedback' order.id %}"
           class="feedback-btn"
           data-confirm
           data-message="Are you sure you want to submit this feedback?"
           data-url="{% url 'report_feedback' order.id %}">
           <i class="fas fa-paper-plane icon-spacing"></i> Submit Feedback
        </a>
    </form>

<script src="{% static 'js/feedback.js' %}"></script>
{% endblock %}
