{% extends 'includes/base.html' %}
{% load static %}

{% block title %}Manager Login - Power Up{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}

<h2 class="page-title" style="color:#e67e22">
    <i class="fa-solid fa-user-shield icon-spacing"></i> Manager Login
</h2>

<div class="container">

    <form method="POST" class="card p-4 shadow mt-4" id="managerLoginForm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="username" class="form-label"><strong>Username</strong></label>
            <input type="text" class="form-control login-input" name="username" id="username" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label"><strong>Password</strong></label>
            <input type="password" class="form-control login-input" name="password" id="password" required>
        </div>

        <button type="submit" class="btn btn-login btn-orange w-100">
            <i class="fas fa-sign-in-alt icon-spacing"></i> Login
        </button>

        <div class="text-center mt-3">
            <p>Back to <a href="{% url 'home' %}" class="back-link auth-link"> Home</a></p>
        </div>
    </form>
</div>

<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
