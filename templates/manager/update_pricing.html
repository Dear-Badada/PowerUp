{% extends "includes/base.html" %}
{% load static %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/update_pricing.css' %}">
{% endblock %}
{% block content %}
<h2 class="page-title">
    <i class="fas fa-dollar-sign icon-spacing"></i>Update Pricing
</h2>

<!-- 表单容器 -->
<div class="pricing-form-container">
    <form method="post">
        {% csrf_token %}
        <div class="pricing-form-group">
            {{ form.as_p }}
        </div>
        <button type="button" class="btn btn-update-pricing" id="showModalBtn">Save Changes</button>
    </form>
</div>

<a href="{% url 'manager_dashboard' %}" class="btn btn-dashboard">Dashboard</a>

<script src="{% static 'js/update_pricing.js' %}"></script>
{% endblock %}
